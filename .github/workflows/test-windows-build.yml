name: build-test-deploy
on: workflow_dispatch
jobs: 
  build:
    runs-on: windows-latest
    steps: 
      - name: Checkout source (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Ensure LFS files are pulled
        shell: pwsh
        run: |
          git lfs install
          git lfs pull
          if (Test-Path .gitmodules) {
            git submodule update --init --recursive
            git -c submodule.recurse=true lfs pull
          }

      - name: Verify SAM weights (not an LFS pointer)
        shell: pwsh
        run: |
          $path = "model_weights/sam_vit_b_01ec64.pth"
          if (-not (Test-Path $path)) { throw "Missing weights at $path. Did LFS fetch run?" }
          $size = (Get-Item $path).Length
          if ($size -lt 314572800) { throw "Weights too small ($size bytes) — likely a Git LFS pointer." }
          Write-Host "Weights OK: $path ($size bytes)"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11.4"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SharkEye
        run: |
          python src/sharkeye_app.py --testing
