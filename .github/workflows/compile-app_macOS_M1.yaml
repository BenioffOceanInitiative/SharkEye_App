name: Build macOS Executable (PyInstaller Spec, Apple Silicon)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos-apple:
    # macos-14 and newer are Apple Silicon (arm64)
    runs-on: macos-14

    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"  # ensure arm64 wheels resolve cleanly

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      
      - name: Setup Python (arm64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.4"
          architecture: "arm64"
          
      - name: Confirm runner and Python architecture
        shell: bash
        run: |
          uname -a
          python -c "import platform, sys; print('Python:', sys.version); print('Machine:', platform.machine()); print('Arch tuple:', platform.architecture())"
          py_machine=$(python -c "import platform; print(platform.machine())")
          [ "$py_machine" = "arm64" ] || (echo "Unexpected Python machine: $py_machine" >&2; exit 1)

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip wheel
          # If you use torch, prefer CPU+MPS wheels on Apple Silicon.
          pip install torch==2.5.1
          pip install -r requirements.txt
          pip install "pyinstaller==6.13.*" "PyQt6<6.8" "PyQt6-Qt6<6.8"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{secrets.ACTIONS_SERVICE_ACCOUNT}}
          
      - name: Run download_models_from_gcs.py
        run: python model_weights/download_models_from_gcs.py
        
      - name: Clean build outputs
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build dist __pycache__

      - name: Build ARM64 with PyInstaller spec
        shell: bash
        run: |
          set -euxo pipefail
          pyinstaller --clean --noconfirm SharkEye.spec

      - name: List ARM64 dist contents
        shell: bash
        run: |
          set -euxo pipefail
          ls -lah dist || true
          if [ -d "dist/SharkEye.app" ]; then
            du -sh dist/SharkEye.app || true
            ls -lah "dist/SharkEye.app/Contents/MacOS" || true
            file "dist/SharkEye.app/Contents/MacOS/"* || true
          elif [ -d "dist/SharkEye" ]; then
            ls -lah dist/SharkEye || true
            file dist/SharkEye/* || true
          fi

      - name: Create ARM64 ZIP archive
        shell: bash
        run: |
          set -euxo pipefail
          date=$(date +"%Y%m%d")
          zipName="SharkEye_macOS_Silicon_$date.zip"
          # If PyInstaller created an .app bundle
          if [ -d "dist/SharkEye.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent dist/SharkEye.app "$zipName"
          elif [ -d "dist/SharkEye" ]; then
            ditto -c -k --sequesterRsrc --keepParent dist/SharkEye "$zipName"
          else
            echo "No known build output found" >&2
            exit 1
          fi
          echo "ZIP_NAME_ARM64=$zipName" >> "$GITHUB_ENV"
          echo "Created $zipName"

      - name: Upload ARM64 build to Google Cloud Bucket
        run: python update_build_in_bucket.py --build_path "${{ env.ZIP_NAME_ARM64 }}"
