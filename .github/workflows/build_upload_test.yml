name: Test File Upload

on: workflow_dispatch

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11.4"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
  
      - name: Authenticate Service Account Credentials 
        uses: 'google-github-actions/auth@v3'
        with:
          credentials_json: '${{secrets.ACTIONS_SERVICE_ACCOUNT}}'
     
      - name: Inspect google package
        run: |
          python -c "import google, inspect; print('google module:', inspect.getfile(google) if hasattr(google, '__file__') else 'namespace package'); print('google path:', list(getattr(google, '__path__', [])))"

      - name: Upload ZIP to Bucket
        run: python src/update_build_in_bucket.py
