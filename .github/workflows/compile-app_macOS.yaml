name: Build macOS Executable (PyInstaller Spec, Intel)

on: [push]

jobs:
  build-macos-intel:
    # macos-13 runners are Intel/x86_64; macos-14 are Apple Silicon
    runs-on: macos-13

    steps:
      - name: Checkout source (with Git LFS)
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          # submodules: recursive   # uncomment if weights live in submodules

      - name: Ensure LFS files are pulled
        shell: bash
        run: |
          set -euxo pipefail
          git lfs install
          git lfs pull
          if [ -f .gitmodules ]; then
            git submodule update --init --recursive
            git -c submodule.recurse=true lfs pull
          fi

      - name: Verify SAM weights (not an LFS pointer)
        shell: bash
        run: |
          set -euxo pipefail
          path="model_weights/sam_vit_b_01ec64.pth"
          if [ ! -f "$path" ]; then
            echo "Missing weights at $path. Did LFS fetch run?" >&2
            exit 1
          fi
          size=$(stat -f%z "$path")
          if [ "$size" -lt 314572800 ]; then
            echo "Weights too small ($size bytes) — likely a Git LFS pointer." >&2
            exit 1
          fi
          echo "Weights OK: $path ($size bytes)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64" # ensure x86_64 on Intel runner

      - name: Confirm runner and Python architecture
        shell: bash
        run: |
          uname -a
          python -c "import platform, sys; print('Python:', sys.version); print('Machine:', platform.machine()); print('Arch tuple:', platform.architecture())"
          # Simple guard: expect x86_64
          py_machine=$(python -c "import platform; print(platform.machine())")
          [ "$py_machine" = "x86_64" ] || (echo "Unexpected Python machine: $py_machine" >&2; exit 1)

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller spec
        shell: bash
        run: |
          set -euxo pipefail
          pyinstaller SharkEye.spec

      - name: List dist contents
        shell: bash
        run: |
          set -euxo pipefail
          ls -lah dist || true
          # PyInstaller on macOS often outputs an .app bundle; list both common layouts
          if [ -d "dist/SharkEye.app" ]; then
            du -sh dist/SharkEye.app || true
            ls -lah "dist/SharkEye.app/Contents/MacOS" || true
          elif [ -d "dist/SharkEye" ]; then
            ls -lah dist/SharkEye || true
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharkEye-macOS-Intel
          path: |
            dist/SharkEye.app
            dist/SharkEye/
          if-no-files-found: warn
