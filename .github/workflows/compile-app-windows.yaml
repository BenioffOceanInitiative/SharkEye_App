name: Build Windows Executable (PyInstaller Spec)

on: [push]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller spec
        run: pyinstaller SharkEye.spec

      # Optional: list contents for debugging
      - name: List dist contents
        run: |
          dir dist
          dir dist\SharkEye

      # Upload full dist folder so it's ready-to-run
      - name: Upload build folder
        uses: actions/upload-artifact@v4
        with:
          name: SharkEye-Windows
          path: dist/SharkEye/
